<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jagdeep Singh | Connect</title>
<meta name="description" content="Connect with Jagdeep Singh on social media.">
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; justify-content:center; align-items:center;
  padding:28px 16px; font-family:Arial,Helvetica,sans-serif; color:#fff;
  background:radial-gradient(circle at top,#24324a 0,#111827 38%,#05070b 100%);
}
.card{
  width:min(430px,100%); padding:30px 22px 24px; text-align:center;
  border:1px solid rgba(255,255,255,.12); border-radius:28px;
  background:rgba(15,23,42,.78); box-shadow:0 20px 60px rgba(0,0,0,.45);
  backdrop-filter:blur(14px);
}
.avatar{
  width:116px;height:116px;border-radius:50%;object-fit:cover;
  border:4px solid rgba(255,255,255,.9); box-shadow:0 8px 30px rgba(0,0,0,.35);
}
h1{margin:16px 0 5px;font-size:29px}
.sub{margin:0 0 24px;color:#b9c3d4}
.links{display:grid;gap:12px}
a{
  display:flex;align-items:center;justify-content:center;gap:12px;
  text-decoration:none;color:#fff;font-weight:700;padding:15px 18px;
  border-radius:15px;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.10); transition:.2s;
}
a:hover{transform:translateY(-2px);background:rgba(255,255,255,.15)}
.icon{font-size:21px;width:26px}
.note{margin:22px 0 0;font-size:12px;color:#8793a8}
</style>
</head>
<body>
<main class="card">
  <img class="avatar" src="profile.jpg" alt="Jagdeep Singh">
  <h1>Jagdeep Singh</h1>
  <p class="sub">Connect with me 👇</p>
  <div class="links">
    <a href="https://www.instagram.com/sardarjagdeep" target="_blank" rel="noopener"><span class="icon">📸</span> Instagram</a>
    <a href="https://snapchat.com/t/SFI8g9uz" target="_blank" rel="noopener"><span class="icon">👻</span> Snapchat</a>
    <a href="https://www.facebook.com/share/1Mcja9xLa9/?mibextid=wwXIfr" target="_blank" rel="noopener"><span class="icon">📘</span> Facebook</a>
    <a href="https://youtube.com/@jagdeepsinghthind" target="_blank" rel="noopener"><span class="icon">▶️</span> YouTube</a>
  </div>
  <p class="note">All my social links in one place.</p>
</main>
</body>
</html>
